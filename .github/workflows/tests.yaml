name: Tests

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      # The tests skip themselves when a prerequisite is absent, so install
      # every prerequisite that the runner image does not already provide:
      # `xxd` and `bc`, which `classfile_check_version` uses.  `apt-get update`
      # is required because the runner image's package index goes stale as the
      # archive moves on.
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xxd bc
      # Check the prerequisites rather than let the runner image silently
      # decide which tests run.
      - name: Check test prerequisites
        run: |
          jq --version
          curl --version || wget --version
          command -v xxd
          command -v bc
      - run: make -C tests test
