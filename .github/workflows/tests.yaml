name: Tests

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      # `classfile_check_version` is a csh script, and its test skips itself
      # when /bin/csh is absent, as it is on the runner image by default.
      - name: Install csh
        run: sudo apt-get install --no-install-recommends --yes tcsh
      # Some tests skip themselves when a prerequisite is absent, so check for
      # the prerequisites rather than let the runner image silently decide
      # which tests run.
      - name: Check test prerequisites
        run: |
          jq --version
          curl --version || wget --version
          test -x /bin/csh
          command -v xxd
          command -v bc
      - run: make -C tests test
