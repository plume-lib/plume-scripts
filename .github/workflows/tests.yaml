name: Tests

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
          persist-credentials: false
      # Some tests skip themselves when a prerequisite is absent, so check for
      # the prerequisites rather than let the runner image silently decide
      # which tests run.
      - name: Check test prerequisites
        run: |
          jq --version
          curl --version || wget --version
      - run: make -C tests test
