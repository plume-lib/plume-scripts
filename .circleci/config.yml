version: 2.1
jobs:
  prek:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run:
          name: Install prek
          command: uv tool install prek
      - run:
          name: Run prek hooks
          command: prek run -q --all-files
  test:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      # Some tests skip themselves when `jq` is absent, so install it rather
      # than depend on whether the image happens to provide it.
      - run:
          name: Install jq
          command: sudo apt-get update && sudo apt-get install -y jq
      - run:
          name: Run the test suite
          command: make -C tests test
workflows:
  build:
    jobs:
      - prek
      - test
